name: Windows release

# Builds the Windows installer and zip for a ZigZag release and uploads
# them to the matching GitHub release. The Mac flow still drives release
# creation (packaging/macos/publish-release.sh); this workflow fires once
# that release is published, so every download ends up on the same release
# page. Use workflow_dispatch to retry or to build without the Mac flow.
#
# The executables and the installer are signed with Azure Artifact Signing
# once the repository has its settings (RELEASE.md, "Signing"); without
# them the same files are built unsigned.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.1.0) to build and attach to.
        required: true
        type: string

permissions:
  contents: write
  # Signing in to Azure without a stored password (OpenID Connect).
  id-token: write

jobs:
  build:
    name: Build zigzag-${{ github.event.release.tag_name || inputs.tag }}-x86_64-windows
    runs-on: windows-latest
    # One name for Azure to trust whatever tag or branch the run is at
    # (RELEASE.md, "Signing").
    environment: windows-release
    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || inputs.tag }}"
          if (-not $tag) { throw "No tag provided." }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Expected a vX.Y.Z tag, got $tag" }
          $version = $tag.TrimStart('v')
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Always build the tagged source so retries match the released Mac build.
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # The installer script and the README come from the commit this
      # workflow runs at (the tag itself for a release), so a manual run can
      # package a tag from before they existed or were last fixed.
      - name: Checkout packaging
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: packaging-ref
          sparse-checkout: packaging/windows

      - name: Verify Cargo.toml version matches tag
        shell: pwsh
        run: |
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($cargoVersion -ne "${{ steps.tag.outputs.version }}") {
            throw "Cargo.toml version ($cargoVersion) doesn't match tag ${{ steps.tag.outputs.tag }}"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release-${{ steps.tag.outputs.tag }}

      - name: Regenerate AppIcon.ico
        shell: pwsh
        run: |
          python -m pip install --upgrade --quiet pillow
          python packaging/windows/make-icon.py

      - name: Build release binaries
        shell: pwsh
        env:
          # Static CRT: one self-contained .exe per binary, no VC++ redist needed.
          RUSTFLAGS: -C target-feature=+crt-static
        run: >
          cargo build --locked --release
          --features gui,ble
          --target x86_64-pc-windows-msvc
          --bin zigzag-studio --bin zigzag --bin zigzag-mcp

      - name: Stage release folder
        id: stage
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"
          $name = "ZigZag-$ver-x86_64-windows"
          $stage = "dist\$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $bin = "target\x86_64-pc-windows-msvc\release"
          # Windows filenames are case-insensitive: the CLI needs a distinct name.
          Copy-Item "$bin\zigzag-studio.exe" "$stage\ZigZag.exe"
          Copy-Item "$bin\zigzag.exe"        "$stage\zigzag-cli.exe"
          Copy-Item "$bin\zigzag-mcp.exe"    "$stage\"
          $executables = @(Get-ChildItem $stage -Filter '*.exe')
          if ($executables.Count -ne 3) { throw "Expected three distinct release executables." }
          foreach ($exeName in @('ZigZag.exe', 'zigzag-cli.exe', 'zigzag-mcp.exe')) {
            $actualVersion = (Get-Item "$stage\$exeName").VersionInfo.ProductVersion
            if ($actualVersion -ne $ver) { throw "$exeName has version $actualVersion; expected $ver" }
          }
          # The studio is a GUI-subsystem executable: wait explicitly so
          # PowerShell keeps its output handles open until it exits.
          $helpOut = Join-Path $env:RUNNER_TEMP 'zigzag-studio-help.stdout.txt'
          $helpErr = Join-Path $env:RUNNER_TEMP 'zigzag-studio-help.stderr.txt'
          $studio = Start-Process -FilePath (Resolve-Path "$stage\ZigZag.exe").Path `
            -ArgumentList '--help' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $helpOut -RedirectStandardError $helpErr
          $studioHelp = Get-Content $helpOut -Raw
          if ($studio.ExitCode -ne 0 -or "$studioHelp" -notmatch 'usage: zigzag-studio') {
            $studioError = Get-Content $helpErr -Raw
            throw "The packaged studio failed its startup check (exit $($studio.ExitCode)).`n$studioError`n$studioHelp"
          }
          $cliVersion = & "$stage\zigzag-cli.exe" --version
          if ($LASTEXITCODE -ne 0 -or $cliVersion -ne "zigzag $ver") {
            throw "The packaged CLI failed its version check."
          }
          Copy-Item LICENSE, NOTICE, THIRD-PARTY-NOTICES.md "$stage\"
          # The lettering fonts that come with ZigZag, beside the programs.
          New-Item -ItemType Directory -Force -Path "$stage\fonts" | Out-Null
          Copy-Item fonts\fonts.json, fonts\*.ttf "$stage\fonts\"
          Copy-Item packaging-ref\packaging\windows\README.txt "$stage\"
          "name=$name"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Signing runs only once the repository has its Azure Artifact Signing
      # settings (see RELEASE.md); until then the downloads are unsigned.
      - name: Sign in to Azure
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The executables are signed before they go into the zip and the
      # installer, so both carry signed copies.
      - name: Sign the executables
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\${{ steps.stage.outputs.stage }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ZigZag
          description-url: https://zigzag.diy

      - name: Build zip and installer
        id: package
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"
          $name = "${{ steps.stage.outputs.name }}"
          $stage = "${{ steps.stage.outputs.stage }}"
          $zip = "dist\$name.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path $stage -DestinationPath $zip

          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Couldn't install Inno Setup." }
          }
          & $iscc /Qp "/DAppVersion=$ver" "/DSourceDir=$PWD\$stage" `
            "/DIconFile=$PWD\packaging\windows\AppIcon.ico" `
            "/DOutputDir=$PWD\dist" "/DOutputName=$name-setup" `
            packaging-ref\packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
          $setup = "dist\$name-setup.exe"
          if (-not (Test-Path $setup)) { throw "Inno Setup didn't write $setup" }
          "zip=$zip"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "setup=$setup" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign the installer
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\${{ steps.package.outputs.setup }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ZigZag
          description-url: https://zigzag.diy

      - name: Check the signatures
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "${{ steps.stage.outputs.stage }}" -Filter '*.exe') +
                   @(Get-Item "${{ steps.package.outputs.setup }}")
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne 'Valid') { throw "$($file.Name) isn't validly signed: $($sig.StatusMessage)" }
            "$($file.Name): signed by $($sig.SignerCertificate.Subject)"
          }

      # Install, look at what the installer left, and uninstall, on the
      # runner: a broken installer never reaches the release.
      - name: Try the installer
        shell: pwsh
        run: |
          $ver = "${{ steps.tag.outputs.version }}"
          $setup = "${{ steps.package.outputs.setup }}"
          $dir = "$env:RUNNER_TEMP\zigzag-install"
          function PathEntries {
            (([Environment]::GetEnvironmentVariable('Path', 'User') + ';' +
              [Environment]::GetEnvironmentVariable('Path', 'Machine')) -split ';')
          }
          $link = 'Registry::HKEY_CLASSES_ROOT\zigzag\shell\open\command'

          $install = Start-Process $setup -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=addtopath', "/DIR=$dir"
          if ($install.ExitCode -ne 0) { throw "The installer exited with $($install.ExitCode)." }
          foreach ($file in @('ZigZag.exe', 'zigzag-cli.exe', 'zigzag-mcp.exe', 'LICENSE', 'unins000.exe')) {
            if (-not (Test-Path "$dir\$file")) { throw "The installer didn't install $file." }
          }
          $cliVersion = & "$dir\zigzag-cli.exe" --version
          if ($LASTEXITCODE -ne 0 -or $cliVersion -ne "zigzag $ver") {
            throw "The installed CLI failed its version check."
          }
          if ((PathEntries) -notcontains $dir) { throw "The installer didn't put ZigZag on the PATH." }
          if (-not (Test-Path $link)) { throw "The installer didn't register zigzag:// links." }
          $command = (Get-Item $link).GetValue('')
          if ($command -ne "`"$dir\ZigZag.exe`" `"%1`"") { throw "zigzag:// links open $command" }

          $uninstall = Start-Process "$dir\unins000.exe" -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($uninstall.ExitCode -ne 0) { throw "The uninstaller exited with $($uninstall.ExitCode)." }
          # The uninstaller finishes from a copy of itself: give it a moment.
          foreach ($try in 1..30) {
            if (-not (Test-Path "$dir\ZigZag.exe")) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path "$dir\ZigZag.exe") { throw "The uninstaller left ZigZag.exe behind." }
          if ((PathEntries) -contains $dir) { throw "The uninstaller left ZigZag on the PATH." }
          if (Test-Path $link) { throw "The uninstaller left the zigzag:// link behind." }

      - name: Checksums
        id: sums
        shell: pwsh
        run: |
          $sums = "dist\SHA256SUMS-windows.txt"
          $lines = foreach ($file in @("${{ steps.package.outputs.zip }}", "${{ steps.package.outputs.setup }}")) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)"
          }
          # Unix line endings: with Windows ones, `shasum -c` on a Mac or
          # Linux looks for a file whose name ends in a carriage return.
          [IO.File]::WriteAllText((Join-Path $PWD $sums), (($lines -join "`n") + "`n"))
          Get-Content $sums
          "sums=$sums" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          # If the release doesn't exist yet (manual run before Mac flow),
          # create it as a draft so the upload has somewhere to go.
          $null = gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo ${{ github.repository }} --draft `
              --title "ZigZag ${{ steps.tag.outputs.version }}"
          }
          gh release upload $tag --repo ${{ github.repository }} --clobber `
            "${{ steps.package.outputs.setup }}" "${{ steps.package.outputs.zip }}" `
            "${{ steps.sums.outputs.sums }}"

      - name: Artifact for retries
        uses: actions/upload-artifact@v4
        with:
          name: ZigZag-${{ steps.tag.outputs.version }}-x86_64-windows
          path: |
            ${{ steps.package.outputs.setup }}
            ${{ steps.package.outputs.zip }}
            ${{ steps.sums.outputs.sums }}
          if-no-files-found: error
