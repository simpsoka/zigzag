[package]
name = "zigzag"
# The release's version is [workspace.package]'s, below: one for every
# package (the release scripts read the first `version = "…"` line).
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Fast SVG-to-embroidery pipeline (PES, DST, Brother PEN) with direct Brother Skitch (PP1) upload"
license = "Apache-2.0"
build = "build.rs"

# The engine (this package, in src/) and what's built on it, in crates/:
# the studio (the editor, a library and the desktop app), ZZZ (the studio in
# the browser) and the MCP relay for it. See docs/architecture.md.
[workspace]
members = ["crates/studio", "crates/web", "crates/relay"]
# Vendored crates are dependencies, not members: their own test suites were
# left out (vendor/README.md).
exclude = ["vendor"]

# The release's version: change it here, for every package.
[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[lib]
name = "zigzag"
path = "src/lib.rs"

[[bin]]
name = "zigzag"
path = "src/main.rs"

# stdio ↔ HTTP bridge to the studio's MCP server (for clients that launch a command).
[[bin]]
name = "zigzag-mcp"
path = "src/mcp_bridge.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
usvg = "0.45"
svgtypes = "0.15"
# Glyph advances for the text caret (the version usvg itself uses).
ttf-parser = "0.25"

i_overlay = { version = "9", default-features = false }
roxmltree = { version = "0.20", default-features = false }
resvg = { version = "0.45", default-features = false }
serde_json = "1.0.154"
base64 = "0.23.1"

# Image Trace (PNG/JPEG/WebP/GIF logos → vector shapes), vendored from
# VectorCraft. See vendor/README.md.
vectorcraft-trace = { path = "vendor/vectorcraft-trace" }
kurbo = "0.13"
# `Instant` that also works in the browser (std's panics there); std's own elsewhere.
web-time = "1"

# The machine conversation (src/machine) is written once and built two ways:
# blocking on the desktop, where a worker thread holds it, and async in the
# browser, where there are no threads and Bluetooth answers with promises.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
maybe-async = { version = "0.2", features = ["is_sync"] }
# Bluetooth upload to the Brother Skitch (PP1), on the desktop. Optional so
# the core pipeline builds anywhere without Bluetooth system libraries. (The
# browser has its own Bluetooth: crates/studio/src/platform.)
btleplug = { version = "0.13", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", optional = true, features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
maybe-async = "0.2"
async-trait = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }

# On Linux, btleplug talks to BlueZ over D-Bus; vendoring libdbus avoids
# needing libdbus-1-dev installed to build.
[target.'cfg(target_os = "linux")'.dependencies]
libdbus-sys = { version = "0.2", optional = true, features = ["vendored"] }

[features]
default = []
ble = ["dep:btleplug", "dep:futures", "dep:tokio", "dep:uuid", "dep:libdbus-sys"]

# Embeds the app icon and version metadata in every ZigZag .exe on Windows.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

# Tracing is slow unoptimized; keep it fast in debug builds and tests.
[profile.dev.package.vectorcraft-trace]
opt-level = 3

[profile.dev.package.vectorcraft-geom]
opt-level = 3

[profile.dev.package.kurbo]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# For trying changes (the letter census, tools/census): as fast as release,
# but built in pieces and incrementally, so an edit rebuilds in seconds
# rather than a minute. `cargo build --profile trial`.
[profile.trial]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
